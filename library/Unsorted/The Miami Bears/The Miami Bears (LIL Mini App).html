<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear Necessities | The Miami Bears</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1220;--phone:#000;--me:#2f7bf6;--them:#26262a;--dim:#8e8e93;--sun1:#ff7a59;--sun2:#ffb15c;--teal:#2ad1c9;--pink:#ff4fa3}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:'Inter',-apple-system,system-ui,sans-serif;color:#fff;
    background:linear-gradient(180deg,#ff8a66 0%,#ff5f8f 38%,#5b3fd6 72%,#101a3a 100%);display:flex;justify-content:center;align-items:flex-start;padding:16px 10px 30px}
  .title{font-family:'Pacifico',cursive;text-align:center;font-size:30px;text-shadow:0 2px 12px rgba(0,0,0,.25);margin-bottom:10px}
  .phone{width:100%;max-width:410px;height:min(780px,88vh);background:var(--phone);border-radius:38px;border:10px solid #15151a;box-shadow:0 26px 60px rgba(0,0,0,.55);
    display:flex;flex-direction:column;overflow:hidden;position:relative}
  .status{display:flex;justify-content:space-between;padding:8px 20px 2px;font-size:13px;font-weight:600}
  .head{display:flex;flex-direction:column;align-items:center;padding:6px 10px 10px;border-bottom:1px solid #1c1c20;background:rgba(18,18,22,.96)}
  .stack{display:flex}
  .av{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .stack .av{margin-left:-9px}.stack .av:first-child{margin-left:0}
  .av img{width:100%;height:100%;object-fit:cover}
  .gname{font-size:13px;font-weight:600;margin-top:5px}
  .gname span{color:var(--dim);font-weight:400}
  .heat{display:flex;gap:10px;margin-top:8px}
  .h{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
  .meter{width:38px;height:5px;border-radius:3px;background:#2a2a2f;overflow:hidden}
  .meter i{display:block;height:100%;width:8%;border-radius:3px;transition:width .6s ease}
  .feed{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
  .feed::-webkit-scrollbar{display:none}
  .stamp{text-align:center;color:var(--dim);font-size:11px;margin:4px 0 8px}
  .sys{text-align:center;color:var(--dim);font-size:11.5px;margin:6px 0}
  .msg{display:flex;align-items:flex-end;gap:6px;max-width:82%;animation:pop .22s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .msg .av{width:26px;height:26px;font-size:11px;border-width:0;visibility:hidden}
  .msg.first .av{visibility:visible}
  .who{font-size:11px;color:var(--dim);margin:6px 0 1px 38px}
  .bub{background:var(--them);padding:8px 12px;border-radius:18px;font-size:15px;line-height:1.35;word-wrap:break-word}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .bub{background:var(--me)}
  .msg.me .av{display:none}
  .typing .bub{display:flex;gap:4px;padding:12px 14px}
  .typing .bub i{width:7px;height:7px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}
  .typing .bub i:nth-child(2){animation-delay:.2s}.typing .bub i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .bar{border-top:1px solid #1c1c20;background:rgba(18,18,22,.96);padding:8px 10px 14px;min-height:58px}
  .fake{display:flex;align-items:center;gap:8px}
  .fake .in{flex:1;border:1px solid #2c2c31;border-radius:20px;padding:9px 14px;color:#5d5d63;font-size:15px}
  .choices{display:flex;flex-direction:column;gap:7px}
  .choices .lab{font-size:11px;color:var(--dim);text-align:center;margin-bottom:2px}
  .ch{border:1px solid #2f7bf6;background:rgba(47,123,246,.12);color:#cfe0ff;text-align:left;font:500 14px 'Inter';padding:10px 13px;border-radius:16px;cursor:pointer}
  .ch:active{background:var(--me);color:#fff}
  .dm{position:absolute;left:10px;right:10px;top:46px;background:rgba(40,40,46,.97);border-radius:16px;padding:12px 14px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5;cursor:pointer}
  .dm.show{display:block;animation:drop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
  .dm .t{display:flex;gap:8px;align-items:center;font-size:12px;color:#c7c7cc;margin-bottom:6px}
  .dm .t .av{width:22px;height:22px;font-size:10px;border:0}
  .dm .t b{color:#fff}
  .dm .body{font-size:14.5px;line-height:1.4}
  .replay{display:block;margin:10px auto 0;background:none;border:1px solid #2c2c31;color:#c7c7cc;border-radius:14px;padding:8px 14px;font:500 13px 'Inter';cursor:pointer}
</style>
</head>
<body>
<div>
  <div class="title">Bear Necessities</div>
  <div class="phone">
    <div class="status"><span>4:12</span><span>●●●● 5G ▮</span></div>
    <div class="dm" id="dm"></div>
    <div class="head">
      <div class="stack" id="stack"></div>
      <div class="gname">Bear Necessities 🐻 <span>4 people + you</span></div>
      <div class="heat" id="heat"></div>
    </div>
    <div class="feed" id="feed"><div class="stamp">Saturday 4:12 PM</div></div>
    <div class="bar" id="bar"><div class="fake"><div class="in">iMessage</div></div></div>
  </div>
</div>

<script>
(function(){ /* mini app scope */
/* IMAGE LINKS: replace the tokens with URLs from the piclink file */
const PICS = {
  M: "{{PIC_MARCUS_1}}",
  J: "https://purplejeepdreams.com/piclink/uploads/ATuGzcCU.png",
  L: "https://purplejeepdreams.com/piclink/uploads/ZQOzqgW2.png",
  Z: "{{PIC_ZION_1}}"
};

const BEARS = {
  M:{ name:"Marcus", color:"#c9893f" },
  J:{ name:"Javi",   color:"#ff4fa3" },
  L:{ name:"Leo",    color:"#ff9a6b" },
  Z:{ name:"Zion",   color:"#2ad1c9" }
};

const heat = { M:1, J:1, L:1, Z:1 };

/* script: [who, text] lines, or a choice object */
const SCRIPT = [
  ["sys","Javi added you to the conversation."],
  ["J","ok everybody be cool"],
  ["J","I added someone"],
  ["M","Javi."],
  ["J","😇"],
  ["Z","Who."],
  ["J","the one from the rope last night. you KNOW who"],
  ["L","OH"],
  ["L","hi!! hi. welcome. sorry. hi"],
  ["L","do you have any allergies? asking for no reason"],
  { q:"Say something",
    opts:[
      { t:"No allergies. Feed me.", h:{L:3,M:1},
        r:[["L","okay okay okay. pastelitos. writing it down"],["M","He's going to bake for six hours now. Say goodbye to Leo."],["L","🥐🥐🥐"]] },
      { t:"Who added me to a group chat with four strangers?", h:{J:3,Z:1},
        r:[["J","strangers?? I put you on THE LIST. in Miami that's basically marriage"],["Z","Fair question."],["J","don't take their side"]] },
      { t:"Which one of you made sure I got home last night?", h:{Z:3,M:1},
        r:[["Z","Me."],["Z","You texted \"home\" at 3:14. Good."],["M","He waited outside until your light came on. He does that."]] }
    ]},
  ["M","So. Tonight."],
  ["M","Boat at sunset first. I'll take her out past Stiltsville."],
  ["J","boat, then Twist, then croquetas at 4. that's the law"],
  ["Z","I'm driving."],
  ["J","you're always driving"],
  ["Z","Yes."],
  ["M","Querido. Do you get seasick? Be honest with me."],
  { q:"Answer Marcus",
    opts:[
      { t:"Never. Put me up front.", h:{M:3,J:1},
        r:[["M","Good. You sit next to the captain."],["J","the captain is him btw. he makes us SAY captain"],["M","Those are the rules."]] },
      { t:"A little. Is that a dealbreaker?", h:{L:2,M:2,Z:1},
        r:[["L","I have ginger candies!! I always have them. they're in my bag"],["M","Never a dealbreaker. I'll keep you in the shade, low in the boat, eyes on the horizon. I've got you."],["Z","He means it."]] },
      { t:"Skip the boat. I want the club.", h:{J:3},
        r:[["J","FINALLY. someone with taste"],["M","Javi."],["J","fine. boat AND club. but I'm putting you by the booth and the DJ owes me a song"]] }
    ]},
  ["L","what should everyone wear?? I don't know what to wear"],
  ["J","linen. it's always linen"],
  ["Z","Shoes you can walk in."],
  ["J","boring but correct"],
  ["Z","One question. For you."],
  ["Z","What do you actually want out of tonight. Not the polite answer."],
  { q:"Answer Zion",
    opts:[
      { t:"Just a really good night.", h:{J:3,Z:1},
        r:[["Z","Then that's what it is. Nobody makes it weird."],["J","I'm going to make it a STORY though"],["Z","Within reason."]] },
      { t:"Honestly? To be taken care of for once.", h:{M:2,L:3},
        r:[["M","Ay. Okay. We can do that."],["L","that's literally my favorite thing in the world. I'm crying a little. normal amount"],["J","he's crying a normal amount"]] },
      { t:"I'll know it when I see it.", h:{Z:3,J:1},
        r:[["Z","Good answer."],["J","he NEVER says good answer"],["J","it's over for the rest of us"]] }
    ]},
  ["M","Then it's settled."],
  ["J","see everybody at 6 💅"],
  ["L","bringing snacks!!"],
  ["Z","👍"]
];

const DMS = {
  M:"Hey. Just me. I'll pick you up at the marina at six. Bring a sweater for the ride back, the water gets cold after dark. I've got everything else. I've got you.",
  J:"ok don't tell the others I'm DMing you 🤫 wear something that looks good in neon. I'll be at the rope at 11 and I'm walking you past it myself. again. 😏",
  L:"hi it's leo. sorry. I made you something for tonight, it's in a little paper bag. you don't have to eat it. you should eat it though. okay bye 🥐",
  Z:"Zion. I'll be outside at 5:40. Black Bronco. If you change your mind about any of it, at any point tonight, text me one word and I'll take you home. No questions."
};

const $ = id => document.getElementById(id);
const feed = $("feed"), bar = $("bar");
let i = 0, lastWho = null;

function avatar(k, cls){
  const d = document.createElement("div");
  d.className = "av " + (cls||"");
  d.style.background = BEARS[k].color;
  d.textContent = BEARS[k].name[0];
  const p = PICS[k];
  if (p && !p.startsWith("{{")) { const img = new Image(); img.alt = BEARS[k].name; img.src = p; img.onload = () => { d.textContent=""; d.appendChild(img); }; }
  return d;
}

(function header(){
  const s = $("stack"), h = $("heat");
  ["M","J","L","Z"].forEach(k => {
    s.appendChild(avatar(k));
    h.insertAdjacentHTML("beforeend", `<div class="h"><div class="meter"><i id="m${k}" style="background:${BEARS[k].color}"></i></div>${BEARS[k].name}</div>`);
  });
  drawHeat();
})();

function drawHeat(){ Object.keys(heat).forEach(k => $("m"+k).style.width = Math.min(100, 8 + heat[k]*12) + "%"); }

function scroll(){ feed.scrollTop = feed.scrollHeight; }

function addLine(who, text){
  if (who === "sys"){ feed.insertAdjacentHTML("beforeend", `<div class="sys">${text}</div>`); lastWho = null; scroll(); return; }
  const first = who !== lastWho;
  if (first && who !== "me") feed.insertAdjacentHTML("beforeend", `<div class="who">${BEARS[who].name}</div>`);
  const m = document.createElement("div");
  m.className = "msg" + (who==="me" ? " me" : "") + (first ? " first" : "");
  if (who !== "me") m.appendChild(avatar(who));
  const b = document.createElement("div"); b.className = "bub"; b.textContent = text; m.appendChild(b);
  feed.appendChild(m);
  lastWho = who; scroll();
}

function typing(who, ms){
  return new Promise(res => {
    const t = document.createElement("div");
    t.className = "msg typing first";
    t.appendChild(avatar(who));
    t.insertAdjacentHTML("beforeend", `<div class="bub"><i></i><i></i><i></i></div>`);
    feed.appendChild(t); scroll();
    setTimeout(() => { t.remove(); res(); }, ms);
  });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function sayLines(lines){
  for (const [who, text] of lines){
    if (who === "sys"){ await wait(500); addLine(who, text); continue; }
    await typing(who, Math.min(1700, 550 + text.length * 22));
    addLine(who, text);
    await wait(260);
  }
}

async function run(){
  while (i < SCRIPT.length){
    const step = SCRIPT[i];
    if (Array.isArray(step)){ await sayLines([step]); i++; continue; }
    await choose(step); i++;
  }
  await wait(900);
  finale();
}

function choose(step){
  return new Promise(res => {
    bar.innerHTML = `<div class="choices"><div class="lab">${step.q}</div></div>`;
    const box = bar.firstChild;
    step.opts.forEach(o => {
      const b = document.createElement("button"); b.className = "ch"; b.textContent = o.t;
      b.onclick = async () => {
        bar.innerHTML = `<div class="fake"><div class="in">iMessage</div></div>`;
        lastWho = null; addLine("me", o.t);
        Object.entries(o.h).forEach(([k,v]) => heat[k] += v); drawHeat();
        await wait(500);
        await sayLines(o.r);
        res();
      };
      box.appendChild(b);
    });
    scroll();
  });
}

function finale(){
  const order = ["M","J","L","Z"];
  const top = order.reduce((a,b) => heat[b] > heat[a] ? b : a, "M");
  const dm = $("dm");
  dm.innerHTML = "";
  const t = document.createElement("div"); t.className = "t";
  t.appendChild(avatar(top));
  t.insertAdjacentHTML("beforeend", `<span><b>${BEARS[top].name}</b> · private message · now</span>`);
  dm.appendChild(t);
  dm.insertAdjacentHTML("beforeend", `<div class="body">${DMS[top]}</div>`);
  dm.classList.add("show");
  dm.onclick = () => dm.classList.remove("show");
  bar.innerHTML = `<div class="sys">${BEARS[top].name} slid into your DMs. Tap the banner to close it.</div><button class="replay" id="replay">Start the chat over</button>`;
  $("replay").onclick = () => location.reload();
}

setTimeout(run, 700);
})();
</script>
</body>
</html>
